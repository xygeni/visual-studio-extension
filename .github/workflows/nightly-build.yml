name: Nightly Build

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

env:
  RUNNING_GITHUB: true

permissions:
  contents: read

jobs:
  # MSBuild and the VS SDK only exist on Windows runners
  build:

    runs-on: windows-latest

    steps:
    # https://github.com/marketplace/actions/checkout
    - name: Checkout the repo
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        ref: main
        fetch-depth: 0

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2
      with:
        vs-version: '[17.0, )'

    # The project uses PackageReference, so MSBuild restores the packages itself
    - name: Build
      shell: powershell
      run: |
        msbuild vs2026-plugin.slnx -restore /p:configuration=Release /p:DeployExtension=false /p:ZipPackageCompressionLevel=normal /v:m

  # The Xygeni action runs on Linux; the scan does not need the build output
  scan:

    runs-on: ubuntu-latest

    steps:
    # https://github.com/marketplace/actions/checkout
    - name: Checkout the repo
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        ref: main
        fetch-depth: 0

      # https://github.com/marketplace/actions/xygeni-scanner
    - name: Xygeni Scanner
      uses: xygeni/xygeni-action@13c6ed2797df7d85749864e2cbcf09c893f43b23 # v6.4.0
      id: Xygeni-Scanner
      with:
        command: scan --never-fail --incremental
        token: ${{ secrets.XYGENI_TOKEN }}
        gh_token: ${{ secrets.GH_PAT_FOR_DOGFOODING }}
