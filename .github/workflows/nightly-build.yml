name: Nightly Build

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

env:
  RUNNING_GITHUB: true

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    # https://github.com/marketplace/actions/checkout
    - name: Checkout the repo
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        ref: develop
        fetch-depth: 0

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2
      with:
        vs-version: '[17.0, )'

    - name: Restore NuGet packages
      run: nuget restore ${{ inputs.solution-file-path }}

    - name: Build
      shell: powershell
      run: |
        msbuild ${{ inputs.solution-file-path }} /p:configuration=Release /p:DeployExtension=false /p:ZipPackageCompressionLevel=normal /v:m
  

      # https://github.com/marketplace/actions/xygeni-scanner
    - name: Xygeni Scanner
      uses: xygeni/xygeni-action@13c6ed2797df7d85749864e2cbcf09c893f43b23 # v6.4.0
      id: Xygeni-Scanner
      with:
        command: scan --never-fail
        token: ${{ secrets.XYGENI_TOKEN }}
        gh_token: ${{ secrets.GH_PAT_FOR_DOGFOODING }}
